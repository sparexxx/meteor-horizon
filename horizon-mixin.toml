[mod]
id = "meteor_horizon"
version = "0.1.0"
priority = 100

# The commit this was authored against. Docs prose pins the Nightly; the exact
# hash has to be filled in from your clone, because it cannot be guessed:
#   cd horizon && git rev-parse HEAD
# Then replace the value below with that hash.
[compatibility]
horizon_revision = "6f8c7a0e5d531d3834c4d0be4659a1db8e7e5c2a"

# The bundle's logic, added to the game as `game::official_meteor_horizon`.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "official_meteor_horizon"
source = "runtime.rs"

# ---------------------------------------------------------------- input ----

# Every module keybind, the GUI key and the global toggle key.
[[injection]]
id = "key"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_key"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

# ----------------------------------------------------------- per frame ----

# Frame clock: drives the Anchor Macro timers and the Auto Totem delay.
[[injection]]
id = "frame"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_frame"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "elapsed", ty = "std::time::Duration", value = "elapsed" },
]

# Tick: refreshes the cached world snapshot used by ESP and X-Ray.
[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# ------------------------------------------------------------- render ----

# The ClickGUI, the ESP label list and the watermark, drawn in 2D.
[[injection]]
id = "hud"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_hud"
helper = "hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "&mut *corners" },
]

# X-Ray: block outline rims around whitelisted ores.
[[injection]]
id = "visuals"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_visuals"
helper = "visuals.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "rims", ty = "&mut Vec<crate::game::native_hooks::NativeBlockRim>", value = "&mut *rims" },
  { name = "lights", ty = "&mut Vec<crate::game::native_hooks::NativeColoredLight>", value = "&mut *lights" },
]

# Ask the renderer for the world depth, so ESP boxes can be depth-tested.
[[injection]]
id = "render_needs"
kind = "HEAD"
target = "horizon_client_render::gfx::native_render::native_render_needs"
helper = "render_needs.rs"
bindings = [
  { name = "needs", ty = "&mut crate::gfx::native_render::RenderNeeds", value = "&mut *needs" },
]

# Genuine 3D Player ESP: real wgpu geometry over the drawn world.
[[injection]]
id = "world_drawn"
kind = "HEAD"
target = "horizon_client_render::gfx::native_render::native_world_drawn"
helper = "world_drawn.rs"
bindings = [
  { name = "world", ty = "&mut crate::gfx::native_render::WorldDrawn<'_>", value = "&mut *world" },
]

# --------------------------------------------------------- lifecycle -----

# Dimension change / world close: drop every cached target and rebuild buffers.
[[injection]]
id = "world_lifecycle"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_world_lifecycle"
helper = "world_lifecycle.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "context", ty = "&crate::game::native_lifecycle::NativeLifecycleContext", value = "context" },
  { name = "phase", ty = "crate::game::native_lifecycle::WorldPhase", value = "phase" },
  { name = "error_text", ty = "&str", value = "error_text" },
]

# --------------------------------------------------- Options > Mods page ---

# The mod's row, listing its keybinds.
[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

# /meteor <module> and /meteor off|on, for when a keybind is not set.
[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]
